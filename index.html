<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>西语拼写练习</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-sans-sc@5.2.10/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/silkscreen@5.2.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/silkscreen@5.2.8/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fusion-pixel-12px-proportional-sc@latest/index.css">
<style>
:root{
  --canvas:#24150f;--walnut-dark:#2d1811;--walnut:#5a321f;
  --paper:#f3e2bc;--paper-deep:#dfc28b;--ink:#2b1710;--cream:#fff2cf;
  --amber:#d5902f;--brick:#9e4333;--olive:#66754a;
  --screen:#26332b;--signal:#bed08c;
  --px-font:"Silkscreen",SFMono-Regular,Menlo,Consolas,monospace;
  --px-zh:"Fusion Pixel 12px Proportional SC",var(--px-font);
  --body-font:"Noto Sans SC Variable","PingFang SC","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--cream);
  font-family:var(--body-font);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.container{max-width:720px;margin:0 auto;padding:0 clamp(12px,3.5vw,28px)}

/* ── 顶栏 ── */
.topbar{position:sticky;top:0;z-index:20;
  background:repeating-linear-gradient(90deg,var(--walnut) 0 24px,var(--walnut-dark) 24px 27px);
  border-bottom:3px solid var(--ink);padding:10px clamp(12px,3.5vw,28px);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flag{width:36px;height:27px;flex:none;border:2px solid var(--ink);
  box-shadow:2px 2px 0 var(--ink);display:grid;grid-template-rows:1fr 2fr 1fr;overflow:hidden}
.flag i{background:#c60b1e}.flag i.m{background:#ffc400}
.flag i.m::after{content:"";width:6px;height:6px;margin:5px auto;background:#c60b1e}
.topbar h1{font-family:var(--px-font);font-weight:700;color:var(--cream);
  font-size:clamp(17px,4.6vw,26px);line-height:1.1;margin:0 auto;text-rendering:geometricPrecision}
.tbstats{font-family:var(--px-font);font-size:9px;color:var(--paper-deep);line-height:1.6;white-space:nowrap}

/* ── 按钮 ── */
.btn{appearance:none;background:var(--amber);color:var(--ink);
  font-family:var(--px-font);font-size:10px;font-weight:700;text-transform:uppercase;
  padding:10px 13px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);line-height:1}
.btn:hover{background:color-mix(in oklch,var(--amber) 88%,var(--ink))}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn-paper{background:var(--paper)}.btn-paper:hover{background:var(--paper-deep)}
.btn-dark{background:var(--walnut-dark);color:var(--cream)}
.btn-olive{background:var(--olive);color:var(--cream)}
.btn-brick{background:var(--brick);color:var(--cream)}

/* ── chips ── */
.levelrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.levelrow .chip{padding:9px 6px;text-align:center;min-width:0}
@media (max-width:480px){.levelrow .chip{font-size:9px;padding:9px 4px}.levelrow .chip .n{font-size:8px}}
.chip{background:transparent;color:var(--paper-deep);font-family:var(--px-font);
  font-size:11px;font-weight:700;padding:9px 13px;line-height:1;
  border:2px solid color-mix(in oklch,var(--paper-deep) 40%,transparent)}
.chip:hover{color:var(--cream);border-color:var(--cream)}
.chip[aria-pressed="true"]{background:var(--amber);color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.chip .n{display:block;font-size:8px;font-weight:400;margin-top:4px;opacity:.8}
.modetoggle{display:flex;margin-top:10px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);width:max-content;background:var(--walnut-dark)}
.modetoggle button{background:transparent;color:var(--paper-deep);border:0;
  font-family:var(--px-font);font-size:9px;font-weight:700;text-transform:uppercase;padding:8px 14px}
.modetoggle button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

/* ── 机身/屏 ── */
.wood{background:repeating-linear-gradient(180deg,var(--walnut) 0 7px,var(--walnut-dark) 7px 9px);
  border:3px solid var(--walnut-dark);box-shadow:6px 6px 0 var(--walnut-dark);
  padding:8px;margin-top:14px}
.screen{background:var(--screen);border:3px solid var(--ink);
  box-shadow:inset 0 0 0 3px rgba(190,208,140,.1);padding:14px;
  min-height:230px;display:flex;flex-direction:column;gap:10px}
.shead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
  font-family:var(--px-font);font-size:9px;font-weight:700;color:var(--signal);
  border-bottom:2px solid color-mix(in oklch,var(--signal) 28%,transparent);padding-bottom:6px}
.sbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;padding-block:6px}
.zhword{font-family:var(--body-font);font-weight:700;
  font-size:clamp(24px,6vw,40px);line-height:1.1;color:var(--cream);margin:0}
.hintline{font-size:12px;color:color-mix(in oklch,var(--signal) 60%,var(--screen));margin:0}
.sfoot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  font-family:var(--px-font);font-size:9px;color:color-mix(in oklch,var(--signal) 70%,var(--screen))}
.verdict{min-height:1.2em;font-family:var(--px-font);font-size:9px;font-weight:700;text-transform:uppercase}
.verdict.ok{color:var(--signal)}.verdict.no{color:#e8a091}

/* 逐字母格 */
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:100%}
.slot{width:clamp(30px,8vw,40px);height:clamp(42px,11vw,52px);display:grid;place-items:center;
  font-family:var(--px-font);font-size:clamp(20px,5.5vw,26px);font-weight:700;
  color:var(--olive);border-bottom:3px solid color-mix(in oklch,var(--signal) 45%,transparent)}
.slot.ok{color:#8fd06a;border-bottom-color:#8fd06a}
.slot.bad{color:#e8a091;border-bottom-color:#e8a091;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* 键盘模式 */
.typebox{display:flex;justify-content:center}
.typebox input{background:var(--paper);color:var(--ink);font-family:var(--body-font);
  font-size:17px;padding:11px 13px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  width:min(280px,80vw)}
.typebox input.bad{border-color:var(--brick);animation:shake .4s}

/* 扔出幽灵 */
.toss{position:fixed;z-index:90;font-family:var(--px-font);font-size:10px;font-weight:700;
  color:var(--ink);background:var(--paper);border:2px solid var(--ink);padding:7px 10px;
  box-shadow:2px 2px 0 var(--ink);pointer-events:none;white-space:nowrap}
@keyframes tossfly{0%{transform:translate(0,0) rotate(0);opacity:1}
  30%{transform:translate(3vw,-4vh) rotate(180deg)}60%{transform:translate(9vw,-3vh) rotate(420deg)}
  100%{transform:translate(22vw,55vh) rotate(760deg);opacity:.05}}
.tossfly{animation:tossfly 1.1s cubic-bezier(.35,.1,.6,1) forwards}

/* 掉落猫狗 + 震动 */
.fallsprite{position:fixed;z-index:95;pointer-events:none;animation:fall var(--fd,3s) linear forwards}
.fallsprite .spin{animation:spin 1.3s linear infinite}
@keyframes fall{0%{transform:translateY(-10vh);opacity:1}100%{transform:translateY(110vh);opacity:.85}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.shakebody{animation:sway .45s ease-in-out 2}
@keyframes sway{0%,100%{transform:translate(0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px)}}

/* 弹窗 */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(20,10,6,.8);
  display:flex;align-items:center;justify-content:center;padding:14px}
#mist-ov{background:rgba(20,10,6,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* ── 悬浮像素贴纸 ── */
.sticker{position:fixed;z-index:5;pointer-events:none;
  animation:swayS var(--sd,5s) ease-in-out infinite alternate}
.sticker i{position:absolute;display:block;width:3px;height:3px}
.sticker .rot{animation:rotS var(--sr,9s) ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes swayS{from{transform:translateX(-7px) translateY(0)}to{transform:translateX(7px) translateY(4px)}}
@keyframes rotS{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@media (max-width:640px){.sticker{transform:scale(.8)}}
.modal{background:var(--paper);color:var(--ink);border:3px solid var(--ink);
  box-shadow:6px 6px 0 var(--ink);width:100%;max-width:540px;max-height:88vh;overflow:auto;padding:20px}
.modal h2{font-family:var(--px-font);font-size:17px;margin-bottom:8px}
.mrow{display:flex;gap:10px;flex-wrap:wrap}
.mcard{flex:1 1 140px;background:var(--paper-deep);border:2px solid var(--ink);
  box-shadow:2px 2px 0 var(--ink);padding:12px;text-align:center}
.mcard.tier-on{background:color-mix(in oklch,var(--amber) 32%,var(--paper-deep))}
.mcard .p{font-family:var(--px-font);font-size:19px;font-weight:700;margin:6px 0}
.mcard .d{font-size:11px;color:color-mix(in oklch,var(--ink) 62%,var(--paper-deep))}

/* 记录/错题/收款 */
.record{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.rcell{background:var(--paper);color:var(--ink);border:2px solid var(--ink);
  box-shadow:2px 2px 0 var(--ink);padding:9px 12px;font-family:var(--px-font);
  font-size:9px;font-weight:700;text-transform:uppercase;flex:1 1 110px;text-align:center}
.rcell b{display:block;font-size:16px;margin-bottom:3px}
.mistpaper{background:var(--paper);color:var(--ink);border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);padding:14px 16px;margin-top:16px}
.mistpaper h2{font-family:var(--px-font);font-size:12px;margin-bottom:6px;text-transform:uppercase}
.mist-row{padding:6px 0;border-top:1px solid color-mix(in oklch,var(--ink) 15%,var(--paper));font-size:13px;display:flex;gap:8px;flex-wrap:wrap}
.mist-row b{font-family:var(--px-font);font-size:11px}
.empty{color:color-mix(in oklch,var(--ink) 55%,var(--paper));font-size:12px;margin:0}
.paybar{margin-top:16px;background:var(--walnut-dark);border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.paybar .tag{font-family:var(--px-font);font-size:8px;font-weight:700;text-transform:uppercase;
  color:var(--amber);border:1px solid var(--amber);padding:3px 7px}
.paybar p{margin:0;font-size:12px;flex:1;min-width:170px;color:var(--paper-deep)}
footer{padding:18px clamp(12px,3.5vw,28px)}
.hidden{display:none}
.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.08)}}
/* 隐形输入框：逐字母模式在手机上唤起键盘 */
.hid-in{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
  width:1px;height:1px;opacity:.01;border:0;padding:0;background:transparent;
  color:transparent;z-index:99;font-size:16px;caret-color:transparent;
  -webkit-appearance:none;appearance:none;outline:0;
  -webkit-user-select:none;user-select:none}
/* 哭泣猫：左右摆动 + 泪滴 */
.catSway{transform-origin:50% 90%;animation:swayX 1.4s ease-in-out infinite alternate}
@keyframes swayX{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.tear{animation:tear 1.2s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:1}100%{transform:translateY(12px);opacity:0}}
/* 线圈记事本 */
.notebook{position:relative;background:var(--walnut-dark);border:3px solid var(--ink);
  box-shadow:6px 6px 0 var(--ink);padding:18px 18px 18px 34px;max-height:84vh;overflow:auto}
.rings{position:absolute;left:5px;top:12px;bottom:12px;width:16px;
  background-image:radial-gradient(circle 4px at 8px 12px,#d8dee6 0 2.5px,#77808c 2.5px 4px,transparent 4px);
  background-size:16px 24px}
.notepage{background:var(--paper);color:var(--ink);padding:14px 16px;
  background-image:repeating-linear-gradient(180deg,transparent 0 26px,color-mix(in oklch,var(--olive) 35%,var(--paper)) 26px 27px)}
.notepage h2{font-family:var(--px-font);font-size:14px;text-transform:uppercase;margin-bottom:8px}
.mist-row{padding:0 0 7px 0;margin:0;font-size:14px;line-height:26px;display:flex;gap:8px}
/* 书包大图 + 卡片网格 */
.bagwrap{position:fixed;z-index:6;left:8px;top:46%;margin:0}
.bagart{position:relative;display:block;border:0;background:transparent;padding:0;
  font-style:normal;line-height:1}
.bagart i{position:absolute;display:block;width:6px;height:6px}
.bagart .baglabel{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);
  font-family:var(--px-font);font-size:9px;font-weight:700;color:var(--paper-deep);white-space:nowrap}
@media (max-width:640px){.bagwrap{left:2px;top:42%}
  .bagart i{width:5px;height:5px}}
.bagart:hover{transform:translate(-2px,-2px)}
.bagart:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.bagart span{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);
  font-family:var(--px-font);font-size:9px;font-weight:700;color:var(--paper-deep);white-space:nowrap}
.baggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bagcard{background:var(--paper);color:var(--ink);border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);padding:12px 10px;text-align:center}
.bagcard .t{font-family:var(--px-font);font-size:10px;font-weight:700;display:block;margin-bottom:8px}
.bagcard .row{display:flex;gap:6px;justify-content:center}
.bagcard .del{background:var(--brick);color:var(--cream);border:2px solid var(--ink);
  font-family:var(--px-font);font-size:8px;font-weight:700;padding:4px 8px}
.bagcard .del:hover{background:color-mix(in oklch,var(--brick) 88%,var(--ink))}
@media (max-width:480px){
  .tbstats{order:5;width:100%;text-align:center}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="flag" aria-label="像素西班牙国旗" role="img"><i></i><i class="m"></i><i></i></div>
  <div style="font-family:var(--px-font);font-size:11px;font-weight:700;color:var(--amber);margin-right:auto;text-transform:uppercase">Ortografía Español</div>
  <div class="tbstats">
    <span id="s-streak">连对 0</span><br>
    <span id="s-quota">今日 0/100</span>
  </div>
</header>

<main class="container" style="padding-bottom:32px">

  <div class="bagwrap">
    <button class="bagart" id="btn-bag" aria-label="打开书包">
      <i id="bag-px" aria-hidden="true"></i><span class="baglabel" id="bag-n">书包 (0)</span>
    </button>
  </div>

  <div class="levelrow" id="levels" role="group" aria-label="选择级别"></div>
  <div class="modetoggle" id="modes" role="group" aria-label="输入模式">
    <button data-mode="slot" aria-pressed="true">逐字母模式</button>
    <button data-mode="type" aria-pressed="false">键盘模式</button>
  </div>

  <h1 style="font-family:var(--px-zh);font-weight:700;font-size:clamp(24px,6vw,38px);
    line-height:1.1;margin-top:18px;text-rendering:geometricPrecision">西语单词机</h1>

  <div class="wood">
    <div class="screen">
      <div class="shead">
        <span id="h-pos">PALABRA 01/02</span>
        <span id="h-level">NIVEL A1</span>
      </div>
      <div class="sbody" id="sbody" aria-live="polite"></div>
      <div class="sfoot" style="justify-content:flex-start;gap:10px">
        <button class="btn btn-paper" id="btn-speak" aria-label="听发音" title="听发音"><svg class="pxi" viewBox="0 0 12 9" width="24" height="18" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true" focusable="false"><rect x="0" y="3" width="1" height="1"/><rect x="0" y="4" width="1" height="1"/><rect x="0" y="5" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="1" y="4" width="1" height="1"/><rect x="1" y="5" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="2" y="3" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="2" y="5" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="3" y="5" width="1" height="1"/><rect x="3" y="6" width="1" height="1"/><rect x="3" y="7" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="4" y="5" width="1" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="4" y="7" width="1" height="1"/><rect x="4" y="8" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="7" y="6" width="1" height="1"/><rect x="9" y="1" width="1" height="1"/><rect x="9" y="2" width="1" height="1"/><rect x="9" y="3" width="1" height="1"/><rect x="9" y="4" width="1" height="1"/><rect x="9" y="5" width="1" height="1"/><rect x="9" y="6" width="1" height="1"/><rect x="9" y="7" width="1" height="1"/></svg></button>
        <button class="btn btn-dark" id="btn-skip">跳过</button>
        <span id="verdict" class="verdict" style="margin-left:6px"></span>
        <span style="display:flex;gap:8px">
          <button class="btn btn-dark hidden" id="btn-hint">提示</button>
          <button class="btn btn-brick hidden" id="btn-throw">扔进错题本</button>
        </span>
      </div>
    </div>
  </div>

  <section class="record" aria-label="练习记录">
    <div class="rcell"><b id="r-acc">—</b>正确率</div>
    <div class="rcell"><b id="r-best">0</b>最高连对</div>
    <div class="rcell"><b id="r-total">0</b>累计练习</div>
  </section>

  <button class="btn btn-brick" id="btn-openmist" style="margin-top:16px">打开错题本 (0)</button>

  <section class="overlay hidden" id="mist-ov" aria-label="错题本">
    <div class="notebook" role="dialog" style="max-width:480px;width:100%">
      <div class="rings" aria-hidden="true"></div>
      <div class="notepage">
        <h2>错题本 <span id="mist-n"></span></h2>
        <div id="mistlist"></div>
        <p class="empty" id="mist-overflow"></p>
        <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
          <button class="btn btn-brick hidden" id="btn-pack">丢进书包</button>
          <button class="btn btn-brick" id="btn-clearmist">清空</button>
          <button class="btn btn-dark" id="btn-closemist" style="margin-left:auto">关闭</button>
        </div>
      </div>
    </div>
  </section>

  <section class="overlay hidden" id="bag-ov" aria-label="书包">
    <div class="notebook" role="dialog" style="max-width:560px;width:100%">
      <div class="rings" aria-hidden="true"></div>
      <div class="notepage">
        <h2>书包</h2>
        <p class="empty" id="bag-hint">书包还空着。错题攒满 20 个词后打包，这里就会出现一本本记事本。</p>
        <div id="baglist" class="baggrid"></div>
        <div style="margin-top:14px;text-align:right">
          <button class="btn btn-dark" id="btn-closebag">关闭</button>
        </div>
      </div>
    </div>
  </section>

  <section class="paybar">
    <span class="tag" id="pay-tag">PAY</span>
    <p id="pay-message">解锁无限练习次数！</p>
    <button class="btn" id="btn-pro">氪金</button>

function addMistake(w){var m=mistakes();
  if(w&&w.es&&!m.some(function(x){return x.es===w.es}))m.push(w);

function cur(){return deck[idx]||{es:"",zh:""}}
function norm(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()}
function say(){try{var u=new SpeechSynthesisUtterance(cur().es);u.lang="es-ES";u.rate=.9;
  speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
var vt=null;
function note(m,cls){var v=safe("verdict");if(!v)return;
  v.textContent=m;v.className="verdict"+(cls?" "+cls:"");
  clearTimeout(vt);if(m)vt=setTimeout(function(){note("")},2600)}

/* ── 统计头部 ── */
function renderStats(){
  var t=store.total||0,ok=store.ok||0,best=store.best||0;
  var proActive=isPro();
  var acc=t?Math.round(ok/t*100)+"%":"—";
  var e;
  (e=safe("s-acc"))&&(e.textContent="正确率 "+acc);
  (e=safe("s-streak"))&&(e.textContent="连对 "+(store.streak||0));
  (e=safe("s-quota"))&&(e.textContent=(proActive?"Pro · 到 "+new Date(AUTH.expiresAt).toLocaleDateString("zh-CN"):"今日 "+quotaNow()+"/"+DAILY_LIMIT));
  var payTag=safe("pay-tag"),payMessage=safe("pay-message"),payButton=safe("btn-pro");
  if(proActive){
    payTag&&(payTag.hidden=true);
    payMessage&&(payMessage.textContent="已永久解锁");
    payButton&&(payButton.hidden=true);
  }else{
    payTag&&(payTag.hidden=false);
    payMessage&&(payMessage.textContent="解锁无限练习次数！");
    payButton&&(payButton.hidden=false);
  }
  (e=safe("r-acc"))&&(e.textContent=acc);
  (e=safe("r-best"))&&(e.textContent=best);
  (e=safe("r-total"))&&(e.textContent=t);
  (e=safe("h-pos"))&&(e.textContent="PALABRA "+String(idx+1).padStart(2,"0")+"/"+String(deck.length).padStart(2,"0"));
  (e=safe("h-level"))&&(e.textContent="NIVEL "+level);
  (e=safe("mist-n"))&&(e.textContent="· "+mistakes().length+" 词");
}
function recordAnswer(ok){
  // 免费次数只统计完整答对的单词；错误输入只影响正确率，不扣免费次数。
  if(ok)quotaInc();
  store.total=(store.total||0)+1;
  if(ok){store.ok=(store.ok||0)+1;store.streak=(store.streak||0)+1;
    if(store.streak>(store.best||0))store.best=store.streak;
    if(store.streak>=10&&store.streak%10===0)celebrate();}
  else{store.streak=0}
  saveStore();renderStats();}

/* ── 连对 10：像素猫狗掉落 + 屏幕震动 ── */
function pxShadow(pxs,scale,color){return pxs.map(function(p){return (p[0]*scale)+"px "+(p[1]*scale)+"px 0 0 "+color}).join(",")}
var CAT_PX=[[1,0],[4,0],[0,1],[5,1],[1,2],[4,2],[0,3],[1,3],[2,3],[3,3],[4,3],[5,3],[2,4],[3,4]];
var DOG_PX=[[1,0],[4,0],[0,1],[5,1],[1,2],[4,2],[1,3],[2,3],[3,3],[4,3],[1,4],[4,4]];
function celebrate(){
  document.body.classList.remove("shakebody");
  void document.body.offsetWidth;
  document.body.classList.add("shakebody");
  for(var i=0;i<9;i++){
    (function(){
      var wrap=document.createElement("div");wrap.className="fallsprite";
      var isCat=(i%2===0);
      var dot=document.createElement("i");
      dot.style.position="absolute";
      dot.style.width=dot.style.height="3px";
      dot.style.boxShadow=pxShadow(isCat?CAT_PX:DOG_PX,3,isCat?"#d5902f":"#8a5a32");
      var sp=document.createElement("span");sp.className="spin";sp.style.display="block";
      sp.appendChild(dot);wrap.appendChild(sp);
      wrap.style.left=(4+Math.random()*88)+"vw";
      wrap.style.top="0";
      wrap.style.setProperty("--fd",(2.4+Math.random()*2)+"s");
      document.body.appendChild(wrap);
      setTimeout(function(){wrap.remove()},5200);
    })();
  }
  note("10 连达成！小猫小狗来贺喜","ok");}

/* ── 扔进错题本 ── */
function throwToMistake(){
  var w=cur();if(!w||!w.es)return;
  var v=safe("verdict");
  var ghost=document.createElement("div");
  ghost.className="toss tossfly";ghost.textContent=w.es+" →";
  if(v){var r=v.getBoundingClientRect();
    ghost.style.left=(r.left)+"px";ghost.style.top=(r.top)+"px";}
  document.body.appendChild(ghost);
  setTimeout(function(){ghost.remove()},1200);
  addMistake(w);
  note("已扔进错题本，咔哒！","ok");
  var h=safe("btn-hint"),t=safe("btn-throw");
  h&&h.classList.add("hidden");t&&t.classList.add("hidden");
  setTimeout(next,600);}

/* ── 逐字母模式 ── */
function renderSlot(){
  var w=cur(),word=String(w.es||"");
  pos=0;failStreak=0;revealed=false;
  var h=safe("btn-hint"),t=safe("btn-throw");
  h&&h.classList.add("hidden");t&&t.classList.add("hidden");
  var b=safe("sbody");if(!b)return;

  /* 关键：连续答题时绝不销毁隐藏 input。
     iOS 一旦发现 input 被从 DOM 删除，原生键盘就会收起。
     所以这里只重绘题目内容，input 本身始终留在 DOM 中。 */
  var hi=safe("slot-hi");
  var hadInput=!!hi;

  if(!hi){
    hi=document.createElement("input");
    hi.className="hid-in";hi.id="slot-hi";hi.type="text";
    hi.autocomplete="off";hi.autocapitalize="none";hi.autocorrect="off";
    hi.spellcheck=false;hi.setAttribute("inputmode","text");
    hi.setAttribute("aria-label","输入字母");
    b.appendChild(hi);
  }

  /* 清掉旧题目，但保留同一个 input 节点和它的焦点状态。 */
  Array.prototype.slice.call(b.children).forEach(function(el){
    if(el!==hi)b.removeChild(el);
  });

  var title=document.createElement("p");
  title.className="zhword";title.textContent=w.zh;
  var hint=document.createElement("p");
  hint.className="hintline";hint.textContent=word.length+" 个字母 · 逐个输入";
  var slots=document.createElement("div");
  slots.className="slots";slots.id="slots";
  for(var i=0;i<word.length;i++){
    var sp=document.createElement("span");sp.className="slot";
    if(word[i]===" "){sp.style.width="12px";sp.style.borderBottom="0";}
    slots.appendChild(sp);
  }
  b.insertBefore(title,hi);
  b.insertBefore(hint,hi);
  b.insertBefore(slots,hi);
  skipSp();

  if(!hadInput){
    var focusSlotInput=function(e){
      var target=e&&e.target;
      /* 点击答题区才唤起键盘；点击按钮等其他控件不抢回键盘。 */
      if(target && target.closest && target.closest("button"))return;
      if(target && target.closest && !target.closest(".slots,.zhword,.hintline"))return;
      try{hi.focus({preventScroll:true})}catch(err){
        try{hi.focus()}catch(err2){}
      }
    };

    /* 手机：在真实触摸手势里同步 focus。 */
    b.addEventListener("pointerdown",focusSlotInput,{passive:true});
    b.addEventListener("touchstart",focusSlotInput,{passive:true});
    b.addEventListener("click",focusSlotInput);

    hi.addEventListener("input",function(){
      var v=hi.value;
      if(v)Array.from(v).forEach(function(ch){slotInput(ch);});
      hi.value="";
    });

    hi.addEventListener("keydown",function(e){
      if(e.key==="Backspace"){
        e.preventDefault();
        backSlot();
      }
    });

    hi.addEventListener("focus",function(){
      try{window.scrollTo(window.scrollX,window.scrollY)}catch(e){}
    });
  }

  renderStats();
}
function skipSp(){var w=cur().es||"";while(pos<w.length&&w[pos]===" ")pos++}
function backSlot(){
  if(pos<=0)return;pos--;
  var w=cur().es||"";while(pos>0&&w[pos]===" ")pos--;
  var c=safe("slots"),s=c&&c.children[pos];
  if(s){s.textContent="";s.className="slot"}}
function slotInput(ch){
  if(revealed||ch===" ")return;
  if(!tryAttempt())return;
  var word=cur().es,ctn=safe("slots");if(!ctn||pos>=word.length)return;
  var target=word[pos];
  var hit=norm(ch)===norm(target);
  var slot=ctn.children[pos];if(!slot)return;
  slot.textContent=hit?target:ch;
  if(hit){
    slot.className="slot ok";pos++;skipSp();
    if(pos>=word.length){sfxOK();recordAnswer(true);note("¡CORRECTO!","ok");setTimeout(next,900)}
  }else{
    slot.className="slot bad";sfxBad();recordAnswer(false);
    setTimeout(function(){slot.textContent="";slot.className="slot"},550);
    failStreak++;
    if(failStreak>=2){
      var h=safe("btn-hint"),t=safe("btn-throw");
      h&&h.classList.remove("hidden");t&&t.classList.remove("hidden");
    }else note("FALLO","no");}
  renderStats();}

/* ── 键盘模式 ── */
function renderType(){
  var w=cur();revealed=false;failStreak=0;
  var h=safe("btn-hint"),t=safe("btn-throw");
  h&&h.classList.add("hidden");t&&t.classList.add("hidden");
  var b=safe("sbody");if(!b)return;
  b.innerHTML='<p class="zhword">'+w.zh+'</p>'+
    '<p class="hintline">输入完整西班牙语单词，回车提交</p>'+
    '<div class="typebox"><input id="t-in" autocomplete="off" spellcheck="false" aria-label="输入西班牙语单词"></div>';
  renderStats();
  var inp=safe("t-in");
  if(inp){
    setTimeout(function(){inp.focus()},50);
    inp.addEventListener("keydown",function(e){
      if(e.key!=="Enter")return;
      e.preventDefault();
      if(!tryAttempt())return;
      if(norm(inp.value)===norm(cur().es)){
        sfxOK();recordAnswer(true);note("¡CORRECTO!","ok");inp.classList.remove("bad");
        setTimeout(next,900);}
      else{
        sfxBad();recordAnswer(false);failStreak++;
        inp.classList.add("bad");
        if(failStreak>=2){
          var hh=safe("btn-hint"),tt=safe("btn-throw");
          hh&&hh.classList.remove("hidden");tt&&tt.classList.remove("hidden");}
        else note("FALLO","no");
        setTimeout(function(){inp.classList.remove("bad");inp.value="";inp.focus()},520);}
      renderStats();});}}

/* ── 账号登录：Supabase Auth 验证身份，Vercel 只按已验证的 user id 记额度/权益。── */
function isPro(){return Number(AUTH.expiresAt)>Date.now()}
function setPro(exp){AUTH.expiresAt=Number(exp)||0;renderStats()}
function authStorage(){try{return JSON.parse(localStorage.getItem("es-auth-v1")||"{}")}catch(e){return{}}}
function saveAuth(){try{localStorage.setItem("es-auth-v1",JSON.stringify({accessToken:AUTH.accessToken,refreshToken:AUTH.refreshToken}))}catch(e){}}
function clearAuth(){AUTH.accessToken="";AUTH.refreshToken="";AUTH.userId="";AUTH.email="";AUTH.count=0;AUTH.expiresAt=0;AUTH.ready=false;try{localStorage.removeItem("es-auth-v1")}catch(e){}}
function showAccountLabel(){
  var el=safe("account-label"),out=safe("btn-logout");
  if(el)el.textContent=AUTH.ready?"已登录："+AUTH.email:"";
  if(out)out.hidden=!AUTH.ready;
}
function showAuthGate(message){
  var old=safe("auth-ov");if(old){var m=safe("auth-message");if(m)m.textContent=message||"";return}
  var ov=document.createElement("div");ov.className="overlay";ov.id="auth-ov";ov.style.zIndex="9999";
  ov.innerHTML='<div class="notebook" role="dialog" aria-modal="true" style="max-width:380px;width:100%"><div class="rings" aria-hidden="true"></div><div class="notepage"><h2>登录 / 注册</h2><p style="font-size:13px">登录后同步每日练习次数和永久解锁权益。</p><form id="auth-form"><label style="display:block;margin:10px 0 4px">邮箱</label><input id="auth-email" type="email" autocomplete="email" required style="width:100%;padding:10px"><label style="display:block;margin:10px 0 4px">密码</label><input id="auth-password" type="password" autocomplete="current-password" minlength="8" required style="width:100%;padding:10px"><button class="btn" id="auth-submit" type="submit" style="margin-top:12px">登录</button><button class="btn btn-dark" id="auth-toggle" type="button" style="margin:12px 0 0 8px">创建账号</button></form><p id="auth-message" role="status" style="font-size:13px;min-height:20px"></p></div></div>';
  document.body.appendChild(ov);
  var form=safe("auth-form"),toggle=safe("auth-toggle"),submit=safe("auth-submit"),register=false;
  if(toggle)toggle.addEventListener("click",function(){register=!register;submit.textContent=register?"创建账号":"登录";toggle.textContent=register?"返回登录":"创建账号";safe("auth-password").setAttribute("autocomplete",register?"new-password":"current-password")});
  if(form)form.addEventListener("submit",function(ev){ev.preventDefault();submit.disabled=true;authSubmit(register).finally(function(){submit.disabled=false})});
}
function authMessage(s){var m=safe("auth-message");if(m)m.textContent=String(s||"")}
async function authSubmit(register){
  try{
    if(!AUTH.config)throw new Error("账户服务尚未配置");
    var email=safe("auth-email").value.trim(),password=safe("auth-password").value;
    var path=register?"/auth/v1/signup?redirect_to="+encodeURIComponent(location.origin):"/auth/v1/token?grant_type=password";
    var r=await fetch(AUTH.config.supabaseUrl.replace(/\/$/,"")+path,{method:"POST",headers:{"Content-Type":"application/json",apikey:AUTH.config.publishableKey},body:JSON.stringify({email:email,password:password})});
    var d=await r.json();
    if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||"登录失败，请检查邮箱和密码");
    if(!d.access_token||!d.refresh_token){authMessage("注册请求已提交。请先点击邮箱验证链接，再返回此处登录。");return}
    AUTH.accessToken=d.access_token;AUTH.refreshToken=d.refresh_token;saveAuth();
    await finishAuthentication();
  }catch(e){authMessage(e.message||"登录失败")}
}
async function refreshAuth(){
  if(!AUTH.refreshToken||!AUTH.config)return false;
  var r=await fetch(AUTH.config.supabaseUrl.replace(/\/$/,"")+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"Content-Type":"application/json",apikey:AUTH.config.publishableKey},body:JSON.stringify({refresh_token:AUTH.refreshToken})});
  if(!r.ok)return false;
  var d=await r.json();if(!d.access_token)return false;
  AUTH.accessToken=d.access_token;AUTH.refreshToken=d.refresh_token||AUTH.refreshToken;saveAuth();return true;
}
async function authFetch(url,options){
  options=options||{};options.headers=Object.assign({},options.headers||{},{Authorization:"Bearer "+AUTH.accessToken});
  var r=await fetch(url,options);
  if(r.status===401&&await refreshAuth()){options.headers.Authorization="Bearer "+AUTH.accessToken;r=await fetch(url,options)}
  return r;
}
async function apiFetch(url,options){if(!AUTH.accessToken)throw new Error("请先登录");return authFetch(url,options)}
async function finishAuthentication(){
  var me=await authFetch(AUTH.config.supabaseUrl.replace(/\/$/,"")+"/auth/v1/user",{headers:{apikey:AUTH.config.publishableKey}});
  if(!me.ok)throw new Error("登录状态已过期，请重新登录");
  var user=await me.json();AUTH.userId=user.id;AUTH.email=user.email||"";
  var r=await apiFetch(PRO_CONFIG.api+"/api/usage");if(!r.ok)throw new Error("无法加载账户额度");
  var d=await r.json();AUTH.count=Number(d.count)||0;AUTH.expiresAt=Number(d.expiresAt)||0;AUTH.ready=true;
  var ov=safe("auth-ov");ov&&ov.remove();showAccountLabel();renderStats();checkPending();
}
async function initializeAccount(){
  showAuthGate("正在连接账户服务…");
  try{
    var cr=await fetch(PRO_CONFIG.api+"/api/config"),cfg=await cr.json();
    if(!cr.ok||!cfg.ok)throw new Error("账户服务尚未配置，请稍后再试");
    AUTH.config={supabaseUrl:cfg.supabaseUrl,publishableKey:cfg.publishableKey};
    var fragment=new URLSearchParams(location.hash.replace(/^#/,""));
    if(fragment.get("access_token")){AUTH.accessToken=fragment.get("access_token");AUTH.refreshToken=fragment.get("refresh_token")||"";saveAuth();history.replaceState(null,"",location.pathname+location.search)}
    if(!AUTH.accessToken){var saved=authStorage();AUTH.accessToken=saved.accessToken||"";AUTH.refreshToken=saved.refreshToken||""}
    if(!AUTH.accessToken){authMessage("请登录或创建账号。新账号需要先验证邮箱。");return}
    try{await finishAuthentication()}catch(e){if(await refreshAuth())await finishAuthentication();else{clearAuth();authMessage("登录状态已过期，请重新登录")}}
  }catch(e){authMessage(e.message||"无法连接账户服务")}
}
function syncPro(){
  if(!AUTH.ready)return;
  apiFetch(PRO_CONFIG.api+"/api/usage").then(function(r){if(!r.ok)throw new Error("无法同步账户");return r.json()})
    .then(function(d){AUTH.count=Number(d.count)||0;AUTH.expiresAt=Number(d.expiresAt)||0;renderStats()})
    .catch(function(){AUTH.ready=false;showAuthGate("账户服务暂时不可用，请重新登录后同步额度")});
}
async function logout(){try{if(AUTH.accessToken&&AUTH.config)await fetch(AUTH.config.supabaseUrl.replace(/\/$/,"")+"/auth/v1/logout",{method:"POST",headers:{apikey:AUTH.config.publishableKey,Authorization:"Bearer "+AUTH.accessToken}})}catch(e){}clearAuth();showAccountLabel();showAuthGate("你已退出登录");renderStats()}

/* ── 音效：WebAudio 合成 ── */
var AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC&&AC.state==="suspended"){AC.resume();}
  return AC}catch(e){return null}}
/* iOS/移动端：任何首次用户手势时解锁音频（调度静音 buffer） */
function unlockAudio(){
  var c=ac();if(!c)return;
  try{
    if(c.__unlocked)return;
    var b=c.createBuffer(1,c.sampleRate*0.03,c.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=0;
    var s=c.createBufferSource();s.buffer=b;
    var g=c.createGain();g.gain.value=0.0001;
    s.connect(g);g.connect(c.destination);
    s.start(0);s.stop(0.04);
    c.__unlocked=true;
  }catch(e){}
}
["touchend","pointerdown","click","keydown"].forEach(function(evt){
  document.addEventListener(evt,unlockAudio,{once:false,passive:true});});
function sfxZip(){ /* 拉链：两段短促噪声扫频 */
  var c=ac();if(!c)return;
  [0,0.12].forEach(function(t0){
    var b=c.createBuffer(1,c.sampleRate*0.09,c.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    var s=c.createBufferSource();s.buffer=b;
    var f=c.createBiquadFilter();f.type="bandpass";
    f.frequency.setValueAtTime(2400+t0*4000,c.currentTime+t0);
    f.Q.value=6;
    var g=c.createGain();g.gain.setValueAtTime(0.22,c.currentTime+t0);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t0+0.09);
    s.connect(f);f.connect(g);g.connect(c.destination);
    s.start(c.currentTime+t0);});}
function sfxPage(){ /* 翻书：一次白噪声沙沙 + 低频拍纸 */
  var c=ac();if(!c)return;
  var b=c.createBuffer(1,c.sampleRate*0.25,c.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  var s=c.createBufferSource();s.buffer=b;
  var f=c.createBiquadFilter();f.type="highpass";f.frequency.value=1200;
  var g=c.createGain();g.gain.setValueAtTime(0.18,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.25);
  s.connect(f);f.connect(g);g.connect(c.destination);s.start();
  var o=c.createOscillator(),og=c.createGain();
  o.frequency.setValueAtTime(180,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(90,c.currentTime+0.12);
  og.gain.setValueAtTime(0.12,c.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.14);
  o.connect(og);og.connect(c.destination);o.start();o.stop(c.currentTime+0.15);}

/* ── 像素风音效：正确=上行方波琶音，错误=下滑锯齿波哔声 ── */
function beepSeq(notes,type,vol){var c=ac();if(!c)return;
  notes.forEach(function(n){var o=c.createOscillator(),g=c.createGain();
    o.type=type;var t=c.currentTime+n[1];
    o.frequency.setValueAtTime(n[0],t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.001,t+n[2]);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+n[2]+0.02);});}
function sfxOK(){beepSeq([[523,0,.08],[659,.08,.08],[784,.16,.08],[1047,.24,.2]],"square",0.12)}
function sfxBad(){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
  o.type="sawtooth";
  o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(70,t+0.35);
  g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.38);}
